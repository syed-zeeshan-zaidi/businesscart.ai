name: Production Deployment

on:
  push:
    branches: [ main ]

jobs:
  build-and-lint:
    name: Build and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
          cache-dependency-path: '**/go.sum'

      - name: Install root dependencies
        run: npm install

      - name: Build root
        run: npm run build

      - name: Install web-portal dependencies
        working-directory: web-portal
        run: npm install

      - name: Build web-portal
        working-directory: web-portal
        run: npm run build

      - name: Lint web-portal
        working-directory: web-portal
        run: npm run lint

      - name: Build and Lint Go Services
        run: |
          for service in account-service catalog-service checkout-service; do
            echo "Building and linting $service"
            cd $service
            go mod tidy
            go build -o main ./cmd/server/main.go
            go fmt ./...
            go vet ./...
            cd ..
          done

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-lint
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install root dependencies
        run: npm install

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: CDK Synth
        run: npx cpx cdk synth --all --context stage=prod

      - name: CDK Deploy
        run: npx cdk deploy --all --context stage=prod --require-approval never

      - name: Invalidate CloudFront Cache
        run: |
          STACK_NAME="BusinessCart-prod"
          DISTRIBUTION_ID_OUTPUT_KEY="CloudFrontDistributionId"
          DISTRIBUTION_ID=$(aws cloudformation describe-stacks --stack-name $STACK_NAME --query "Stacks[0].Outputs[?OutputKey=='$DISTRIBUTION_ID_OUTPUT_KEY'].OutputValue" --output text)
          if [ -z "$DISTRIBUTION_ID" ]; then
            echo "CloudFront Distribution ID not found in stack outputs."
            exit 1
          fi
          aws cloudfront create-invalidation --distribution-id $DISTRIBUTION_ID --paths "/*"
