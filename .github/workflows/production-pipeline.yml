name: Production Deployment

on:
  push:
    branches: [ main ]

jobs:
  call-build-and-lint:
    name: Build and Lint
    uses: ./.github/workflows/code-quality.yml

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: call-build-and-lint
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install root dependencies
        run: npm install

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: CDK Synth
        run: npx cdk synth --all --context stage=prod

      - name: CDK Deploy
        run: npx cdk deploy --all --context stage=prod --require-approval never