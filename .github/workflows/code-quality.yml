name: Reusable Build and Lint

on:
  workflow_call:

jobs:
  build-and-lint:
    name: Build and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
          cache-dependency-path: '**/go.sum'

      - name: Install root dependencies
        run: npm install

      - name: Build root
        run: npm run build

      - name: Install web-portal dependencies
        working-directory: web-portal
        run: npm install

      - name: Build web-portal
        working-directory: web-portal
        run: npm run build

      - name: Lint web-portal
        working-directory: web-portal
        run: npm run lint

      - name: Build and Lint Go Services
        run: |
          # Build account-service
          cd account-service
          go mod tidy
          go build -o bootstrap ./cmd/server/main.go
          go fmt ./...
          go vet ./...
          cd ..

          # Build catalog-service
          cd catalog-service
          go mod tidy
          go build -o bootstrap ./cmd/server/main.go
          go fmt ./...
          go vet ./...
          cd ..

          # Build checkout-service
          cd checkout-service
          go mod tidy
          go build -o server ./cmd/server
          go fmt ./...
          go vet ./...
          cd ..

