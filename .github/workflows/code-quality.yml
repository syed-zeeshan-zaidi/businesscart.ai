name: Reusable Build and Lint

on:
  workflow_call:

jobs:
  build-and-lint:
    name: Build and Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            web-portal/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: '**/go.sum'

      - name: Install root dependencies
        run: npm install

      - name: Build root
        run: npm run build

      - name: Install web-portal dependencies
        working-directory: web-portal
        run: npm install

      - name: Build web-portal
        working-directory: web-portal
        run: npm run build

      - name: Lint web-portal
        working-directory: web-portal
        run: npm run lint

      - name: Build and Lint Go Services
        run: |
          for service in account-service catalog-service checkout-service; do
            echo "=== $service ==="
            cd $service
            go mod tidy
            git diff --exit-code go.mod go.sum || (echo "FAIL: go.mod/go.sum not tidy in $service" && exit 1)
            go build -o bootstrap ./cmd/server/...
            unformatted=$(gofmt -l . | grep -v '^vendor/' || true)
            test -z "$unformatted" || (echo "FAIL: unformatted files in $service:" && echo "$unformatted" && exit 1)
            go vet ./...
            cd ..
          done

      - name: Test Go Services
        run: |
          for service in account-service catalog-service checkout-service; do
            echo "=== Testing $service ==="
            cd $service
            go test ./...
            cd ..
          done
